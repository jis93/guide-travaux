<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1730" viewBox="0 0 760 1730" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="1730" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#0f172a">Cuisine en L — VARIANTE C : colonne four+MO + colonne 20</text>
  <text x="30" y="60" font-size="12" fill="#475569">Mur 1 = 260 cm · Mur 2 = 300 cm · profondeur 60 · HSP 250 — colonne 20 entre colonne four et plaque · fileurs 5 dans l'angle</text>

  <!-- ===================== TOP VIEW ===================== -->
  <text x="30" y="98" font-size="16" font-weight="bold" fill="#0f172a">1) Vue de dessus</text>
  <g transform="translate(130,120)">
    <text x="300" y="150" font-size="13" fill="#94a3b8">espace / pièce</text>
    <line x1="0" y1="0" x2="0" y2="390" stroke="#111827" stroke-width="5"/>
    <line x1="0" y1="390" x2="450" y2="390" stroke="#111827" stroke-width="5"/>

    <!-- Mur 1 -->
    <g transform="translate(0,-7.5)">
    <rect x="0" y="0"   width="90" height="90" fill="#dbeafe" stroke="#1e40af"/>
    <text x="45" y="40" font-size="11" text-anchor="middle" fill="#1e3a8a">colonne</text>
    <text x="45" y="54" font-size="11" text-anchor="middle" fill="#1e3a8a">four+MO</text>
    <rect x="0" y="90"  width="90" height="30" fill="#fde2f3" stroke="#be185d"/>
    <text x="45" y="109" font-size="10" text-anchor="middle" fill="#831843">colonne 20</text>
    <rect x="0" y="120" width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="178" font-size="11" text-anchor="middle" fill="#0f172a">plaque 60</text>
    <rect x="25" y="130" width="55" height="24" fill="#cbd5e1" stroke="#334155"/>
    <rect x="0" y="210" width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="259" font-size="11" text-anchor="middle" fill="#0f172a">tiroir 60</text>
    </g>
    <rect x="0" y="292.5" width="90" height="7.5" fill="#fef3c7" stroke="#b45309"/>
    <rect x="0" y="300" width="90" height="90" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="45" y="341" font-size="11" text-anchor="middle" fill="#374151">coin</text>
    <text x="45" y="355" font-size="11" text-anchor="middle" fill="#374151">pôle</text>

    <!-- Mur 2 -->
    <g transform="translate(7.5,0)">
    <rect x="90"  y="300" width="90" height="90" fill="#dbeafe" stroke="#1e40af"/>
    <text x="135" y="349" font-size="11" text-anchor="middle" fill="#1e3a8a">LV 60</text>
    <rect x="180" y="300" width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <rect x="195" y="315" width="60" height="50" fill="#cbd5e1" stroke="#334155"/>
    <text x="225" y="344" font-size="11" text-anchor="middle" fill="#0f172a">évier 60</text>
    <rect x="270" y="300" width="30" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="285" y="349" font-size="9"  text-anchor="middle" fill="#0f172a">t20</text>
    <rect x="300" y="300" width="135" height="90" fill="#dbeafe" stroke="#1e40af"/>
    <text x="367" y="349" font-size="11" text-anchor="middle" fill="#1e3a8a">FRIGO 90</text>
    </g>
    <rect x="90" y="300" width="7.5" height="90" fill="#fef3c7" stroke="#b45309"/>
    <rect x="442.5" y="300" width="7.5" height="90" fill="#fef3c7" stroke="#b45309"/>

    <text x="-22" y="195" font-size="12" text-anchor="middle" fill="#0f172a" transform="rotate(-90 -22 195)">Mur 1 = 260 cm (meubles 265 : dépassent de 5)</text>
    <text x="225" y="415" font-size="12" text-anchor="middle" fill="#0f172a">Mur 2 = 300 cm</text>
  </g>

  <!-- ===================== MUR 1 ELEVATION ===================== -->
  <text x="30" y="640" font-size="16" font-weight="bold" fill="#0f172a">2) Élévation Mur 1 — colonne four+MO, colonne 20, plaque, angle à droite</text>
  <g transform="translate(130,670)">
    <rect x="240" y="0" width="150" height="45" fill="#fde68a" stroke="#b45309"/>
    <text x="315" y="28" font-size="10" text-anchor="middle" fill="#7c2d12">coffrage (sous-face 220)</text>

    <g transform="translate(-7.5,0)">
    <!-- colonne four + MO (full height) -->
    <rect x="0" y="0" width="90" height="375" fill="#dbeafe" stroke="#1e40af"/>
    <text x="45" y="26" font-size="10" text-anchor="middle" fill="#1e3a8a">colonne</text>
    <rect x="12" y="95" width="66" height="45" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="45" y="122" font-size="10" text-anchor="middle" fill="#7f1d1d">MO</text>
    <rect x="12" y="150" width="66" height="85" fill="#cbd5e1" stroke="#334155"/>
    <text x="45" y="197" font-size="11" text-anchor="middle" fill="#0f172a">FOUR</text>
    <rect x="12" y="300" width="66" height="66" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="337" font-size="9" text-anchor="middle" fill="#0f172a">tiroir</text>

    <!-- colonne 20 (pleine hauteur, coulissante) -->
    <rect x="90" y="0" width="30" height="375" fill="#fde2f3" stroke="#be185d"/>
    <line x1="105" y1="20" x2="105" y2="355" stroke="#f9a8d4" stroke-dasharray="3 3"/>
    <text x="105" y="190" font-size="10" text-anchor="middle" fill="#831843" transform="rotate(-90 105 190)">colonne 20 coulissante (épices, huiles, plaques four)</text>

    <!-- upper cabinets (140->220) -->
    <rect x="210" y="45" width="60" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="240" y="108" font-size="10" text-anchor="middle" fill="#0f172a">plats 40</text>
    <rect x="270" y="45" width="60" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="300" y="108" font-size="10" text-anchor="middle" fill="#0f172a">réserve 40</text>
    <!-- angle ouvert : étagères 150 / 170 / 190 -->
    <rect x="330" y="90" width="67.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <rect x="330" y="120" width="67.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <rect x="330" y="150" width="67.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <text x="364" y="112" font-size="8" text-anchor="middle" fill="#0f172a">thés (30)</text>
    <!-- hotte -->
    <rect x="120" y="45" width="90" height="90" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="165" y="85" font-size="10" text-anchor="middle" fill="#0f172a">meuble hotte</text>
    <rect x="123" y="120" width="84" height="15" fill="#cbd5e1" stroke="#334155"/>
    <text x="165" y="131" font-size="9" text-anchor="middle" fill="#0f172a">hotte casquette</text>

    <!-- worktop -->
    <line x1="120" y1="240" x2="390" y2="240" stroke="#334155" stroke-width="4"/>
    <rect x="120" y="233" width="90" height="8" fill="#334155"/>

    <!-- base cabinets -->
    <rect x="120" y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <text x="165" y="228" font-size="9"  text-anchor="middle" fill="#64748b">plaque</text>
    <line x1="120" y1="285" x2="210" y2="285" stroke="#94a3b8"/><line x1="120" y1="330" x2="210" y2="330" stroke="#94a3b8"/>
    <text x="165" y="366" font-size="9" text-anchor="middle" fill="#0f172a">tiroir (sous plaque)</text>
    <rect x="210" y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <line x1="210" y1="285" x2="300" y2="285" stroke="#94a3b8"/><line x1="210" y1="330" x2="300" y2="330" stroke="#94a3b8"/>
    <text x="255" y="366" font-size="9" text-anchor="middle" fill="#0f172a">tiroir 60 casseroles</text>
    </g>
    <rect x="292.5" y="240" width="7.5" height="135" fill="#fef3c7" stroke="#b45309"/>
    <line x1="380" y1="240" x2="390" y2="240" stroke="#334155" stroke-width="4"/>
    <rect x="300" y="240" width="90" height="135" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="345" y="312" font-size="10" text-anchor="middle" fill="#374151">coin</text>

    <line x1="0" y1="0" x2="390" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="375" x2="390" y2="375" stroke="#111827" stroke-width="4"/>

    <text x="-14" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-14" y="49"  font-size="10" text-anchor="end" fill="#334155">220</text>
    <text x="-14" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
    <text x="-14" y="244" font-size="10" text-anchor="end" fill="#334155">90</text>
    <text x="-14" y="378" font-size="10" text-anchor="end" fill="#334155">0</text>

    <!-- LED + prises -->
    <line x1="210" y1="168" x2="390" y2="168" stroke="#f59e0b" stroke-width="3"/>
    <text x="300" y="182" font-size="9" text-anchor="middle" fill="#b45309">LED sous meubles hauts</text>
    <rect x="140" y="46" width="12" height="12" fill="#fed7aa" stroke="#ea580c"/><text x="157" y="56" font-size="8" fill="#7c2d12">16A hotte</text>
    <rect x="248" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="255" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">2×16A (B)</text>
    <rect x="338" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="345" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">coin 4×16A (A)</text>
    <rect x="38" y="300" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="45" y="297" font-size="8" text-anchor="middle" fill="#3730a3">four 20A + MO 16A</text>
    <rect x="158" y="326" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="165" y="323" font-size="8" text-anchor="middle" fill="#3730a3">32A plaque</text>
    <text x="195" y="405" font-size="12" text-anchor="middle" fill="#0f172a">265 cm = 60 + 20 + 60 + 60 + fileur 5 + coin 60 (dépasse le mur de 5) ; hauts 40 + 40 + étagères d'angle</text>
  </g>

  <!-- ===================== MUR 2 ELEVATION ===================== -->
  <text x="30" y="1180" font-size="16" font-weight="bold" fill="#0f172a">3) Élévation Mur 2 — MO parti dans la colonne → au-dessus évier libéré</text>
  <g transform="translate(130,1210)">
    <!-- angle ouvert : étagères 0→65, bouche VMC dégagée -->
    <rect x="0" y="90" width="127.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <rect x="0" y="120" width="127.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <rect x="0" y="150" width="127.5" height="3" fill="#a57c52" stroke="#7c5a36" stroke-width="0.5"/>
    <text x="55" y="112" font-size="8" text-anchor="middle" fill="#0f172a">thés (30)</text>
    <circle cx="94.5" cy="49.5" r="13.5" fill="#fff" stroke="#0e7490" stroke-width="1.5"/>
    <text x="94.5" y="52.5" font-size="7" text-anchor="middle" fill="#0e7490">VMC</text>
    <text x="94.5" y="77" font-size="7" text-anchor="middle" fill="#0e7490">~63 cm · h 217</text>
    <g transform="translate(37.5,0)">
    <rect x="90" y="15" width="90" height="150" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="135" y="92" font-size="10" text-anchor="middle" fill="#0f172a">vaisselle</text>
    <rect x="180" y="15" width="90" height="150" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="225" y="80" font-size="10" text-anchor="middle" fill="#0f172a">café / tasses</text>
    <text x="225" y="94" font-size="9"  text-anchor="middle" fill="#16a34a">(+ rangement)</text>
    <rect x="270" y="0" width="135" height="75" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="337" y="42" font-size="10" text-anchor="middle" fill="#0f172a">rare / saisonnier</text>
    </g>
    <line x1="0" y1="240" x2="307.5" y2="240" stroke="#334155" stroke-width="4"/>

    <rect x="0"   y="240" width="90" height="135" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="45"  y="312" font-size="10" text-anchor="middle" fill="#374151">coin</text>
    <g transform="translate(7.5,0)">
    <rect x="90"  y="240" width="90" height="135" fill="#dbeafe" stroke="#1e40af"/>
    <text x="135" y="312" font-size="11" text-anchor="middle" fill="#1e3a8a">LV</text>
    <rect x="180" y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <rect x="188" y="233" width="74" height="9" fill="#cbd5e1"/>
    <line x1="180" y1="300" x2="270" y2="300" stroke="#94a3b8"/>
    <text x="225" y="280" font-size="11" text-anchor="middle" fill="#0f172a">évier</text>
    <text x="225" y="345" font-size="9" text-anchor="middle" fill="#0f172a">2 tiroirs</text>
    <rect x="270" y="240" width="30" height="135" fill="#eef2f6" stroke="#334155"/>
    <text x="285" y="312" font-size="9"  text-anchor="middle" fill="#0f172a">t20</text>
    <rect x="300" y="75" width="135" height="300" fill="#dbeafe" stroke="#1e40af"/>
    <text x="367" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a">FRIGO 90</text>
    </g>
    <rect x="90" y="240" width="7.5" height="135" fill="#fef3c7" stroke="#b45309"/>
    <rect x="442.5" y="75" width="7.5" height="300" fill="#fef3c7" stroke="#b45309"/>
    <text x="446" y="60" font-size="8" text-anchor="middle" fill="#7c2d12">joue 5</text>

    <line x1="0" y1="0" x2="450" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="375" x2="450" y2="375" stroke="#111827" stroke-width="4"/>

    <text x="-8" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-8" y="19"  font-size="10" text-anchor="end" fill="#334155">240</text>
    <text x="-8" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
    <text x="-8" y="244" font-size="10" text-anchor="end" fill="#334155">90</text>
    <text x="-8" y="378" font-size="10" text-anchor="end" fill="#334155">0</text>

    <line x1="0" y1="168" x2="300" y2="168" stroke="#f59e0b" stroke-width="3"/>
    <text x="150" y="182" font-size="9" text-anchor="middle" fill="#b45309">LED sous meubles hauts</text>
    <rect x="38" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="45" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">coin 2×16A (A)</text>
    <rect x="128" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="135" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">LV 2×16A (B)</text>
    <rect x="128" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="135" y="324" font-size="8" text-anchor="middle" fill="#3730a3">20A LV</text>
    <rect x="360" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="367" y="324" font-size="8" text-anchor="middle" fill="#3730a3">16A frigo</text>
    <text x="225" y="405" font-size="12" text-anchor="middle" fill="#0f172a">300 cm — hauts à 240 ; angle ouvert : étagères 150 / 170 / 190 (thés), VMC dégagée</text>
  </g>

  <!-- legend -->
  <g transform="translate(130,1660)">
    <rect x="0"   y="0" width="16" height="12" fill="#eef2f6" stroke="#334155"/><text x="22" y="10" font-size="10" fill="#0f172a">meuble</text>
    <rect x="90"  y="0" width="16" height="12" fill="#dbeafe" stroke="#1e40af"/><text x="112" y="10" font-size="10" fill="#0f172a">électroménager / colonne</text>
    <rect x="260" y="0" width="16" height="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/><text x="282" y="10" font-size="10" fill="#0f172a">meuble haut</text>
    <rect x="380" y="0" width="16" height="12" fill="#fde68a" stroke="#b45309"/><text x="402" y="10" font-size="10" fill="#0f172a">coffrage / joue / fileur</text>
    <rect x="560" y="0" width="16" height="12" fill="#fde2f3" stroke="#be185d"/><text x="582" y="10" font-size="10" fill="#0f172a">colonne 20</text>
    <rect x="0" y="22" width="16" height="12" fill="#fed7aa" stroke="#ea580c"/><text x="22" y="32" font-size="10" fill="#0f172a">prise 16A (plan)</text>
    <rect x="150" y="22" width="16" height="12" fill="#e0e7ff" stroke="#4338ca"/><text x="172" y="32" font-size="10" fill="#0f172a">circuit spécialisé (derrière l'appareil)</text>
    <line x1="380" y1="28" x2="396" y2="28" stroke="#f59e0b" stroke-width="3"/><text x="402" y="32" font-size="10" fill="#0f172a">LED</text>
    <text x="0" y="54" font-size="10" fill="#0f172a">Variante C = B + colonne 20 coulissante entre colonne four et plaque : plaque décollée de la colonne (casseroles</text>
    <text x="0" y="68" font-size="10" fill="#0f172a">pas contre le côté), épices/huiles à portée du feu. Coût : 2 tir.40 → 1 tiroir 60 ; plan 80→200 (≈ 40 cm de moins que A).</text>
  </g>
</svg>
