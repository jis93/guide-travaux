<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1730" viewBox="0 0 760 1730" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="760" height="1730" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#0f172a">Cuisine en L — plans (échelle 1,5 px/cm)</text>
  <text x="30" y="60" font-size="12" fill="#475569">Mur 1 = 260 cm · Mur 2 = 300 cm · profondeur 60 · HSP 250</text>

  <!-- ===================== TOP VIEW ===================== -->
  <text x="30" y="98" font-size="16" font-weight="bold" fill="#0f172a">1) Vue de dessus</text>
  <g transform="translate(130,120)">
    <!-- room hint -->
    <text x="300" y="150" font-size="13" fill="#94a3b8">espace / pièce</text>
    <!-- walls -->
    <line x1="0" y1="0" x2="0" y2="390" stroke="#111827" stroke-width="5"/>
    <line x1="0" y1="390" x2="450" y2="390" stroke="#111827" stroke-width="5"/>

    <!-- Mur 1 cabinets (left strip x0-90) -->
    <rect x="0" y="0"   width="90" height="60" fill="#e2e8f0" stroke="#334155"/>
    <text x="45" y="34" font-size="11" text-anchor="middle" fill="#0f172a">armoire 40</text>
    <rect x="0" y="60"  width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="100" font-size="11" text-anchor="middle" fill="#0f172a">four/plaque</text>
    <text x="45" y="114" font-size="11" text-anchor="middle" fill="#0f172a">60</text>
    <rect x="25" y="120" width="55" height="24" fill="#cbd5e1" stroke="#334155"/>
    <rect x="0" y="150" width="90" height="60" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="184" font-size="11" text-anchor="middle" fill="#0f172a">tiroir 40</text>
    <rect x="0" y="210" width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="45" y="252" font-size="11" text-anchor="middle" fill="#0f172a">tiroir 60</text>
    <text x="45" y="266" font-size="9"  text-anchor="middle" fill="#64748b">casseroles</text>

    <!-- shared dead corner -->
    <rect x="0" y="300" width="90" height="90" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="45" y="341" font-size="11" text-anchor="middle" fill="#374151">coin</text>
    <text x="45" y="355" font-size="11" text-anchor="middle" fill="#374151">pôle</text>

    <!-- Mur 2 cabinets (bottom strip y300-390) -->
    <rect x="90"  y="300" width="90" height="90" fill="#dbeafe" stroke="#1e40af"/>
    <text x="135" y="349" font-size="11" text-anchor="middle" fill="#1e3a8a">LV 60</text>
    <rect x="180" y="300" width="90" height="90" fill="#eef2f6" stroke="#334155"/>
    <rect x="195" y="315" width="60" height="50" fill="#cbd5e1" stroke="#334155"/>
    <text x="225" y="344" font-size="11" text-anchor="middle" fill="#0f172a">évier 60</text>
    <rect x="270" y="300" width="30" height="90" fill="#eef2f6" stroke="#334155"/>
    <text x="285" y="349" font-size="9"  text-anchor="middle" fill="#0f172a">t20</text>
    <rect x="300" y="300" width="135" height="90" fill="#dbeafe" stroke="#1e40af"/>
    <text x="367" y="349" font-size="11" text-anchor="middle" fill="#1e3a8a">FRIGO 90</text>
    <rect x="435" y="300" width="15" height="90" fill="#fef3c7" stroke="#b45309"/>

    <!-- dimensions -->
    <text x="-22" y="195" font-size="12" text-anchor="middle" fill="#0f172a" transform="rotate(-90 -22 195)">Mur 1 = 260 cm</text>
    <text x="225" y="415" font-size="12" text-anchor="middle" fill="#0f172a">Mur 2 = 300 cm</text>
  </g>

  <!-- ===================== MUR 1 ELEVATION ===================== -->
  <text x="30" y="640" font-size="16" font-weight="bold" fill="#0f172a">2) Élévation Mur 1 (vue de face) — extrémité ouverte à gauche, angle à droite</text>
  <g transform="translate(130,670)">
    <!-- coffrage (from corner, 100cm, underside 220) -->
    <rect x="240" y="0" width="150" height="45" fill="#fde68a" stroke="#b45309"/>
    <text x="315" y="28" font-size="10" text-anchor="middle" fill="#7c2d12">coffrage (sous-face 220)</text>

    <!-- full-height armoire -->
    <rect x="0" y="0" width="60" height="375" fill="#e2e8f0" stroke="#334155"/>
    <text x="30" y="180" font-size="11" text-anchor="middle" fill="#0f172a">armoire</text>
    <text x="30" y="196" font-size="9"  text-anchor="middle" fill="#64748b">garde-</text>
    <text x="30" y="208" font-size="9"  text-anchor="middle" fill="#64748b">manger</text>

    <!-- upper cabinets (140->220) -->
    <rect x="150" y="45" width="120" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="210" y="108" font-size="11" text-anchor="middle" fill="#0f172a">plats / bols</text>
    <rect x="270" y="45" width="120" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="330" y="108" font-size="11" text-anchor="middle" fill="#0f172a">réserve</text>
    <!-- hotte -->
    <rect x="65" y="110" width="80" height="55" fill="#e2e8f0" stroke="#334155"/>
    <text x="105" y="142" font-size="11" text-anchor="middle" fill="#0f172a">hotte</text>

    <!-- worktop -->
    <line x1="60" y1="240" x2="390" y2="240" stroke="#334155" stroke-width="4"/>
    <!-- hob on worktop -->
    <rect x="60" y="233" width="90" height="8" fill="#334155"/>

    <!-- base cabinets (240->375) -->
    <rect x="60"  y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <text x="105" y="300" font-size="10" text-anchor="middle" fill="#0f172a">four</text>
    <text x="105" y="228" font-size="9"  text-anchor="middle" fill="#64748b">plaque</text>
    <rect x="150" y="240" width="60" height="135" fill="#eef2f6" stroke="#334155"/>
    <line x1="150" y1="285" x2="210" y2="285" stroke="#94a3b8"/><line x1="150" y1="330" x2="210" y2="330" stroke="#94a3b8"/>
    <text x="180" y="366" font-size="9" text-anchor="middle" fill="#0f172a">tir.40</text>
    <rect x="210" y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <line x1="210" y1="285" x2="300" y2="285" stroke="#94a3b8"/><line x1="210" y1="330" x2="300" y2="330" stroke="#94a3b8"/>
    <text x="255" y="366" font-size="9" text-anchor="middle" fill="#0f172a">tiroir 60 (casseroles)</text>
    <rect x="300" y="240" width="90" height="135" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="345" y="312" font-size="10" text-anchor="middle" fill="#374151">coin</text>

    <!-- ceiling & floor -->
    <line x1="0" y1="0" x2="390" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="375" x2="390" y2="375" stroke="#111827" stroke-width="4"/>

    <!-- height ticks -->
    <text x="-8" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-8" y="49"  font-size="10" text-anchor="end" fill="#334155">220</text>
    <text x="-8" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
    <text x="-8" y="244" font-size="10" text-anchor="end" fill="#334155">90</text>
    <text x="-8" y="378" font-size="10" text-anchor="end" fill="#334155">0</text>
    <!-- LED + prises -->
    <line x1="150" y1="168" x2="390" y2="168" stroke="#f59e0b" stroke-width="3"/>
    <text x="270" y="182" font-size="9" text-anchor="middle" fill="#b45309">LED sous meubles hauts</text>
    <rect x="99" y="46" width="12" height="12" fill="#fed7aa" stroke="#ea580c"/><text x="116" y="56" font-size="8" fill="#7c2d12">16A hotte</text>
    <rect x="173" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="180" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">2×16A (B)</text>
    <rect x="338" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="345" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">coin 4×16A (A)</text>
    <rect x="98" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="105" y="324" font-size="8" text-anchor="middle" fill="#3730a3">32A+20A</text>
    <text x="195" y="405" font-size="12" text-anchor="middle" fill="#0f172a">260 cm — hauts calés à 220 (ligne uniforme sous coffrage)</text>
  </g>

  <!-- ===================== MUR 2 ELEVATION ===================== -->
  <text x="30" y="1180" font-size="16" font-weight="bold" fill="#0f172a">3) Élévation Mur 2 (vue de face) — angle à gauche, frigo à droite</text>
  <g transform="translate(130,1210)">
    <!-- upper cabinets (140->240), corner capped at 220 -->
    <rect x="0" y="45" width="90" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="45" y="108" font-size="10" text-anchor="middle" fill="#0f172a">angle</text>
    <text x="45" y="122" font-size="9"  text-anchor="middle" fill="#64748b">(220)</text>
    <rect x="90" y="15" width="90" height="150" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="135" y="92" font-size="10" text-anchor="middle" fill="#0f172a">vaisselle</text>
    <rect x="180" y="15" width="90" height="150" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="225" y="55" font-size="10" text-anchor="middle" fill="#0f172a">café / tasses</text>
    <!-- microwave -->
    <rect x="188" y="108" width="74" height="57" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="225" y="141" font-size="11" text-anchor="middle" fill="#7f1d1d">MO</text>
    <rect x="270" y="15" width="30" height="150" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <!-- above fridge cabinet -->
    <rect x="300" y="0" width="135" height="75" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="367" y="42" font-size="10" text-anchor="middle" fill="#0f172a">rare / saisonnier</text>

    <!-- worktop -->
    <line x1="0" y1="240" x2="300" y2="240" stroke="#334155" stroke-width="4"/>

    <!-- base -->
    <rect x="0"   y="240" width="90" height="135" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="45"  y="312" font-size="10" text-anchor="middle" fill="#374151">coin</text>
    <rect x="90"  y="240" width="90" height="135" fill="#dbeafe" stroke="#1e40af"/>
    <text x="135" y="312" font-size="11" text-anchor="middle" fill="#1e3a8a">LV</text>
    <rect x="180" y="240" width="90" height="135" fill="#eef2f6" stroke="#334155"/>
    <rect x="188" y="233" width="74" height="9" fill="#cbd5e1"/>
    <text x="225" y="312" font-size="11" text-anchor="middle" fill="#0f172a">évier</text>
    <rect x="270" y="240" width="30" height="135" fill="#eef2f6" stroke="#334155"/>
    <text x="285" y="312" font-size="9"  text-anchor="middle" fill="#0f172a">t20</text>
    <!-- fridge full height -->
    <rect x="300" y="75" width="135" height="300" fill="#dbeafe" stroke="#1e40af"/>
    <text x="367" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a">FRIGO 90</text>
    <!-- joue -->
    <rect x="435" y="75" width="15" height="300" fill="#fef3c7" stroke="#b45309"/>
    <text x="443" y="60" font-size="8" text-anchor="middle" fill="#7c2d12">joue</text>

    <!-- ceiling & floor -->
    <line x1="0" y1="0" x2="450" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="375" x2="450" y2="375" stroke="#111827" stroke-width="4"/>

    <!-- height ticks -->
    <text x="-8" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-8" y="19"  font-size="10" text-anchor="end" fill="#334155">240</text>
    <text x="-8" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
    <text x="-8" y="244" font-size="10" text-anchor="end" fill="#334155">90</text>
    <text x="-8" y="378" font-size="10" text-anchor="end" fill="#334155">0</text>
    <!-- LED + prises -->
    <line x1="0" y1="168" x2="300" y2="168" stroke="#f59e0b" stroke-width="3"/>
    <text x="150" y="182" font-size="9" text-anchor="middle" fill="#b45309">LED sous meubles hauts</text>
    <rect x="38" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="45" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">coin 2×16A (A)</text>
    <rect x="128" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="135" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">LV 2×16A (B)</text>
    <rect x="240" y="120" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="247" y="117" font-size="8" text-anchor="middle" fill="#3730a3">16A MO</text>
    <rect x="128" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="135" y="324" font-size="8" text-anchor="middle" fill="#3730a3">20A LV</text>
    <rect x="360" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="367" y="324" font-size="8" text-anchor="middle" fill="#3730a3">16A frigo</text>
    <text x="225" y="405" font-size="12" text-anchor="middle" fill="#0f172a">300 cm — hauts à 240 (pas de coffrage) ; angle calé à 220</text>
  </g>

  <!-- legend -->
  <g transform="translate(130,1660)">
    <rect x="0"   y="0" width="16" height="12" fill="#eef2f6" stroke="#334155"/><text x="22" y="10" font-size="10" fill="#0f172a">meuble</text>
    <rect x="90"  y="0" width="16" height="12" fill="#dbeafe" stroke="#1e40af"/><text x="112" y="10" font-size="10" fill="#0f172a">électroménager</text>
    <rect x="230" y="0" width="16" height="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/><text x="252" y="10" font-size="10" fill="#0f172a">meuble haut</text>
    <rect x="360" y="0" width="16" height="12" fill="#fde68a" stroke="#b45309"/><text x="382" y="10" font-size="10" fill="#0f172a">coffrage / joue</text>
    <rect x="500" y="0" width="16" height="12" fill="#fee2e2" stroke="#b91c1c"/><text x="522" y="10" font-size="10" fill="#0f172a">micro-ondes</text>
    <rect x="0" y="22" width="16" height="12" fill="#fed7aa" stroke="#ea580c"/><text x="22" y="32" font-size="10" fill="#0f172a">prise 16A (plan)</text>
    <rect x="150" y="22" width="16" height="12" fill="#e0e7ff" stroke="#4338ca"/><text x="172" y="32" font-size="10" fill="#0f172a">circuit spécialisé</text>
    <line x1="305" y1="28" x2="321" y2="28" stroke="#f59e0b" stroke-width="3"/><text x="327" y="32" font-size="10" fill="#0f172a">LED sous hauts</text>
    <text x="0" y="54" font-size="10" fill="#0f172a">Prises plan de travail = 2 circuits 20A dédiés : (A) pôle coin (blender/cuiseur/robot) · (B) reste + café/bouilloire</text>
  </g>
</svg>
