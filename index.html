<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide travaux</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2024; --muted:#5b636b; --line:#e6e8eb;
    --accent:#0f7a6c; --accent-soft:#e6f4f1; --card:#f7f9fa;
    --warn-bg:#fff4e5; --warn-line:#f0b429; --tip-bg:#e9f6ee; --tip-line:#2f9e5f;
    --side:#f4f6f7; --sidew:290px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e7eaed; --muted:#9aa4ad; --line:#2a2f35;
      --accent:#39c0ad; --accent-soft:#12332e; --card:#1b1f23;
      --warn-bg:#2e2410; --warn-line:#c99a1e; --tip-bg:#122a1c; --tip-line:#2f9e5f;
      --side:#101316;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  a{color:var(--accent)}

  .layout{display:flex; min-height:100vh}
  .sidebar{flex:0 0 var(--sidew); width:var(--sidew); background:var(--side);
    border-right:1px solid var(--line); position:sticky; top:0; align-self:flex-start;
    height:100vh; overflow-y:auto; padding:20px 16px 40px}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.15rem;
    text-decoration:none; color:var(--fg); padding:4px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:12px}
  .group{margin:14px 0}
  .group-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:700; padding:4px 8px; display:flex; gap:6px}
  .nav a{display:block; text-decoration:none; color:var(--fg); padding:7px 10px;
    border-radius:8px; font-size:.94rem; margin:2px 0}
  .nav a:hover{background:var(--accent-soft)}
  .nav a.active{background:var(--accent); color:#fff; font-weight:600}

  .content{flex:1; min-width:0; display:flex; justify-content:center}
  .inner{width:100%; max-width:800px; padding:34px 24px 90px}

  .topbar{display:none; position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line); padding:10px 14px; align-items:center; gap:12px}
  .burger{font-size:1.4rem; background:none; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:2px 10px; cursor:pointer}
  .scrim{display:none}

  .fiche h1{font-size:1.7rem; line-height:1.2; margin:0 0 18px; padding-bottom:12px;
    border-bottom:2px solid var(--accent)}
  .lead{color:var(--muted); font-size:1.02rem}
  .block{margin:22px 0}
  .block h2{font-size:1.05rem; margin:0 0 8px}
  .block ul,.block ol{margin:6px 0; padding-left:22px}
  .block li{margin:6px 0}
  .bref{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0}
  .bref span{background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:8px 14px; font-size:.9rem; min-width:120px}
  .bref b{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); margin-bottom:2px}
  .callout{border-radius:10px; padding:14px 18px; border:1px solid}
  .callout h2{margin-top:0}
  .warn{background:var(--warn-bg); border-color:var(--warn-line)}
  .tip{background:var(--tip-bg); border-color:var(--tip-line)}

  .home-list{list-style:none; padding-left:0}
  .home-list li{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
  .home-list a{font-weight:600; text-decoration:none}
  .home-list a:hover{text-decoration:underline}
  .tag{font-size:.72rem; background:var(--accent-soft); color:var(--accent);
    padding:2px 8px; border-radius:999px; white-space:nowrap}
  footer{margin-top:50px; padding-top:16px; border-top:1px solid var(--line);
    color:var(--muted); font-size:.82rem}

  @media (max-width:820px){
    .sidebar{position:fixed; z-index:30; transform:translateX(-100%);
      transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.25)}
    body.nav-open .sidebar{transform:none}
    body.nav-open .scrim{display:block; position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.4)}
    .topbar{display:flex}
    .inner{padding:22px 18px 80px}
  }
  @media print{
    .sidebar,.topbar{display:none!important}
    .content{display:block}
    .inner{max-width:none; padding:0}
    .callout,.block,.bref span{break-inside:avoid}
    a{color:inherit}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <strong>🛠️ Guide travaux</strong>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a href="#" class="brand">🛠️ Guide travaux</a>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="content">
    <div class="inner" id="content"></div>
  </main>
</div>

/* ---------- rendu ---------- */
function fmt(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
}
function list(items, ordered){
  const t = ordered ? "ol" : "ul";
  return "<"+t+">"+items.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</"+t+">";
}
function renderFiche(f){
  return ""
   + "<article class='fiche'>"
   + "<h1>"+(f.icone||"")+" "+fmt(f.titre)+"</h1>"
   + "<div class='block'><h2>🎯 Objectif</h2><p class='lead'>"+fmt(f.objectif)+"</p></div>"
   + "<div class='bref'>"
     + "<span><b>Difficulté</b>"+fmt(f.bref.diff)+"</span>"
     + "<span><b>Durée</b>"+fmt(f.bref.duree)+"</span>"
     + "<span><b>Budget</b>"+fmt(f.bref.budget)+"</span>"
   + "</div>"
   + "<div class='block callout warn'><h2>⚠️ Sécurité &amp; vigilance</h2>"+list(f.securite)+"</div>"
   + "<div class='block'><h2>🧰 Outillage</h2>"+list(f.outillage)+"</div>"
   + "<div class='block'><h2>📦 Matériel / fournitures</h2>"+list(f.materiel)+"</div>"
   + "<div class='block'><h2>🔧 Étapes</h2>"+list(f.etapes,true)+"</div>"
   + "<div class='block callout tip'><h2>💡 Astuces &amp; pièges</h2>"+list(f.astuces)+"</div>"
   + "<div class='block'><h2>👷 Pro ou DIY ?</h2><p>"+fmt(f.pro)+"</p></div>"
   + "</article>";
}
function renderHome(){
  var h = "<article class='fiche'><h1>🛠️ Mes travaux</h1>"
    + "<p class='lead'>Rubriques rangées dans <strong>l'ordre du chantier</strong>. Choisis une fiche dans le menu — "
    + "<strong>toutes suivent la même trame</strong> : Objectif · En bref · Sécurité · Outillage · Matériel · Étapes · Astuces · Pro ou DIY.</p>"
    + "<div class='block callout tip'><h2>🗺️ Ordre du chantier conseillé</h2><ol>"
      + "<li><strong>Dépose</strong> de l'ancien sol.</li>"
      + "<li><strong>Réseaux</strong> : élec, plomberie, chauffage (saignées, câbles, tubes) — <em>avant</em> le sol.</li>"
      + "<li><strong>Pose du sol</strong> (parquet).</li>"
      + "<li><strong>Montages</strong> : cuisine puis dressing.</li>"
      + "</ol><p style='margin:8px 0 0'>Règle d'or : les <strong>réseaux passent avant le sol fini</strong>, et les <strong>meubles en dernier</strong>. "
      + "Sur un <strong>parquet flottant</strong>, évite de coincer les lames sous une cuisine lourde (pose autour de l'emprise ou laisse le flottant libre).</p></div>";
  DATA.forEach(function(r){
    h += "<div class='block'><h2>"+(r.icone||"")+" "+fmt(r.titre)+"</h2><ul class='home-list'>";
    r.fiches.forEach(function(f){
      h += "<li><a href='#"+f.id+"'>"+(f.icone||"")+" "+fmt(f.titre)+"</a><span class='tag'>"+fmt(f.bref.diff)+"</span></li>";
    });
    h += "</ul></div>";
  });
  h += "<footer>Mémo perso — vérifie toujours le type de mur, les charges et les réseaux (eau/élec/gaz) avant d'intervenir. En cas de doute sur l'électricité, la plomberie sous pression ou le gaz : fais appel à un pro.</footer>";
  h += "</article>";
  return h;
}
function buildNav(){
  var nav = document.getElementById("nav");
  nav.innerHTML = DATA.map(function(r){
    return "<div class='group'><div class='group-title'>"+(r.icone||"")+" "+fmt(r.titre)+"</div>"
      + r.fiches.map(function(f){ return "<a href='#"+f.id+"'>"+fmt(f.titre)+"</a>"; }).join("")
      + "</div>";
  }).join("");
}
function route(){
  var id = location.hash.replace(/^#/,"");
  var fiche = null;
  DATA.forEach(function(r){ r.fiches.forEach(function(f){ if(f.id===id) fiche=f; }); });
  document.getElementById("content").innerHTML = fiche ? renderFiche(fiche) : renderHome();
  Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function(a){
    a.classList.toggle("active", a.getAttribute("href") === "#"+id);
  });
  document.body.classList.remove("nav-open");
  window.scrollTo(0,0);
}
buildNav();
window.addEventListener("hashchange", route);
route();

document.getElementById("burger").addEventListener("click", function(){ document.body.classList.toggle("nav-open"); });
document.getElementById("scrim").addEventListener("click", function(){ document.body.classList.remove("nav-open"); });
</script>
</body>
