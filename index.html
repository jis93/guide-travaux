<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide travaux</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2024; --muted:#5b636b; --line:#e6e8eb;
    --accent:#0f7a6c; --accent-soft:#e6f4f1; --card:#f7f9fa;
    --warn-bg:#fff4e5; --warn-line:#f0b429; --tip-bg:#e9f6ee; --tip-line:#2f9e5f;
    --side:#f4f6f7; --sidew:290px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e7eaed; --muted:#9aa4ad; --line:#2a2f35;
      --accent:#39c0ad; --accent-soft:#12332e; --card:#1b1f23;
      --warn-bg:#2e2410; --warn-line:#c99a1e; --tip-bg:#122a1c; --tip-line:#2f9e5f;
      --side:#101316;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:var(--accent)}

  .layout{display:flex; min-height:100vh}
  .sidebar{flex:0 0 var(--sidew); width:var(--sidew); background:var(--side);
    border-right:1px solid var(--line); position:sticky; top:0; align-self:flex-start;
    height:100vh; overflow-y:auto; padding:20px 16px 40px}
  .brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.15rem;
    text-decoration:none; color:var(--fg); padding:4px 8px 16px; border-bottom:1px solid var(--line); margin-bottom:12px}
  .group{margin:14px 0}
  .group-title{font-size:.72rem; text-transform:uppercase; letter-spacing:.07em;
    color:var(--muted); font-weight:700; padding:4px 8px; display:flex; gap:6px}
  .nav a{display:block; text-decoration:none; color:var(--fg); padding:7px 10px;
    border-radius:8px; font-size:.94rem; margin:2px 0}
  .nav a:hover{background:var(--accent-soft)}
  .nav a.active{background:var(--accent); color:#fff; font-weight:600}

  .content{flex:1; min-width:0; display:flex; justify-content:center}
  .inner{width:100%; max-width:800px; padding:34px 24px 90px}

  .topbar{display:none; position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line); padding:10px 14px; align-items:center; gap:12px}
  .burger{font-size:1.4rem; background:none; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:2px 10px; cursor:pointer}
  .scrim{display:none}

  .fiche h1{font-size:1.7rem; line-height:1.2; margin:0 0 18px; padding-bottom:12px; border-bottom:2px solid var(--accent)}
  .lead{color:var(--muted); font-size:1.02rem}
  .block{margin:22px 0}
  .block h2{font-size:1.05rem; margin:0 0 8px}
  .block ul,.block ol{margin:6px 0; padding-left:22px}
  .block li{margin:6px 0}
  .bref{display:flex; flex-wrap:wrap; gap:10px; margin:16px 0}
  .bref span{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:.9rem; min-width:120px}
  .bref b{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:2px}
  .callout{border-radius:10px; padding:14px 18px; border:1px solid}
  .callout h2{margin-top:0}
  .warn{background:var(--warn-bg); border-color:var(--warn-line)}
  .tip{background:var(--tip-bg); border-color:var(--tip-line)}

  /* steps */
  .step{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; background:var(--card)}
  .step-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .step-num{flex:0 0 26px; width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff;
    font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center}
  .step-title{font-weight:600; flex:1 1 auto; min-width:0}
  .step-time{font-size:.76rem; color:var(--muted); background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:2px 9px; white-space:nowrap}
  .step-tools{display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 0}
  .chip{font-size:.73rem; background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:2px 8px}
  .step ul{margin:8px 0 0; padding-left:20px}
  .step li{margin:4px 0}

  .home-list{list-style:none; padding-left:0}
  .home-list li{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
  .home-list a{font-weight:600; text-decoration:none}
  .home-list a:hover{text-decoration:underline}
  .tag{font-size:.72rem; background:var(--accent-soft); color:var(--accent); padding:2px 8px; border-radius:999px; white-space:nowrap}
  footer{margin-top:50px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:.82rem}

  @media (max-width:820px){
    .sidebar{position:fixed; z-index:30; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.25)}
    body.nav-open .sidebar{transform:none}
    body.nav-open .scrim{display:block; position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.4)}
    .topbar{display:flex}
    .inner{padding:22px 18px 80px}
  }
  @media print{
    .sidebar,.topbar{display:none!important}
    .content{display:block}
    .inner{max-width:none; padding:0}
    .callout,.block,.bref span,.step{break-inside:avoid}
    a{color:inherit}
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <strong>🛠️ Guide travaux</strong>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a href="#" class="brand">🛠️ Guide travaux</a>
    <div class="nav" id="nav"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="content"><div class="inner" id="content"></div></main>
</div>

<script>
/* étape = { t:titre, d:durée, o:[outils], sub:[sous-étapes] } */
const DATA = [

  { titre:"1 · Dépose", icone:"🧹", fiches:[
    { id:"depose-sol", titre:"Dépose de l'ancien revêtement", icone:"🧹",
      objectif:"Retirer l'ancien revêtement (parquet stratifié flottant et/ou carrelage) pour repartir sur un support propre et plan.",
      bref:{diff:"Facile (flottant) → Difficile (carrelage)", duree:"½ à 2 j", budget:"Location perfo ~40-60 €/j + sacs"},
      securite:["**Poussière ++** : masque FFP2, lunettes, gants, casque anti-bruit, aérer, bâcher.","**Amiante** : colle/carrelage **avant 1997** → **diagnostic obligatoire** avant de burineur.","Repérer gaines/tuyaux dans la chape."],
      outillage:["Perforateur SDS + burin large","Massette + burin à main","Pied-de-biche, cutter, spatule","Règle de 2 m, aspirateur de chantier"],

        { t:"Déposer les plinthes", d:"~20-40 min", o:["Cutter","Pied-de-biche","Cale"], sub:["Passer le cutter le long de la plinthe (peinture/joint).","Décoller au pied-de-biche + cale (protéger le mur).","Numéroter si réutilisées ; retirer les pointes."] },
        { t:"Déposer le stratifié flottant", d:"~30 min / pièce", o:["Mains","Petit levier"], sub:["Repérer le sens de pose, commencer par la dernière lame près d'un mur.","Déclipser lame par lame (soulever ~30° puis tirer).","Empiler les lames, retirer la sous-couche."] },
        { t:"Casser & déposer le carrelage", d:"~1-3 h", o:["Perforateur SDS","Burin large","Massette"], sub:["Amorcer en cassant un carreau au centre.","Engager le burin **à plat sous les carreaux**, à l'interface colle/chape.","Progresser par rangées ; sacs remplis **à moitié** (lourd)."] },
        { t:"Nettoyer & contrôler le support", d:"~30-60 min", o:["Burin","Règle 2 m","Aspirateur"], sub:["Éliminer résidus de colle/ragréage → support plan.","Contrôler la planéité à la règle de 2 m (creux/bosses).","Aspirer ; noter si un ragréage sera nécessaire."] },
        { t:"Évacuer les gravats", d:"variable", o:["Sacs","Diable"], sub:["Sortir les sacs mi-remplis.","Direction déchetterie (carrelage non recyclable en tout-venant)."] }

      securite:["⚠️ **COUPER le disjoncteur + VAT** avant tout. Jamais sous tension.","**NF C 15-100** : circuits **dédiés** (plaque 32 A/6 mm², prises PdT 20 A/2,5 mm²).","**Terre obligatoire** ; pas de prise au-dessus évier/plaques."],
      outillage:["VAT / multimètre + testeur de prise","Tournevis isolés, pince à dénuder/coupante","Rainureuse ou burineur","Perforateur + scie cloche"],

        { t:"Réaliser les saignées", d:"~1-2 h", o:["Rainureuse","Burineur","Scie cloche","Aspirateur"], sub:["Tracer (verticales/horizontales, **jamais en diagonale**).","Rainurer puis buriner ; percer les logements de boîtes.","Aspirer/dépoussiérer."] },
        { t:"Tirer les câbles", d:"~30-60 min", o:["Gaine ICTA","Aiguille"], sub:["Passer la gaine ICTA dans les saignées.","Tirer le câble depuis la boîte de dérivation / circuit dédié.","Laisser ~15-20 cm de mou à chaque boîte."] },
        { t:"Poser boîtes & raccorder", d:"~45 min", o:["MAP","Tournevis","Pince à dénuder","Wago"], sub:["Sceller les boîtes au nu du placo.","Raccorder **phase / neutre / terre** (respecter les couleurs).","Wago pour les dérivations."] },
        { t:"Reboucher & finir", d:"~30 min (+ séchage)", o:["Enduit","Spatule"], sub:["Reboucher les saignées, lisser.","Poncer après séchage (peinture plus tard)."] },
        { t:"Remettre en service & tester", d:"~10 min", o:["Testeur de prise"], sub:["Réenclencher le disjoncteur.","Tester chaque prise (phase/neutre/terre OK).","Vérifier l'absence de déclenchement."] }
      ],
      astuces:["⚠️ Cuisine = circuits **dédiés**, ne pas repiquer n'importe où.","Fais ces passages **avant le sol et avant les meubles**.","Note/photographie le repérage au tableau."],

      materiel:["WC classique **ou WC broyeur**","Pipe/manchon d'évacuation, robinet d'arrêt, flexible","Joints, silicone sanitaire, chevilles sol"],
      etapes:[

        { t:"Diagnostiquer l'évacuation (clé !)", d:"~20 min", o:["Mètre","Lampe"], sub:["Repérer le diamètre existant (souvent **Ø40** lave-linge).","Localiser la chute EU + sa distance.","Décider : **WC classique** (Ø100 + pente possible ?) ou **WC broyeur** (Ø40/32)."] },
        { t:"Positionner & pré-fixer la cuvette", d:"~30-45 min", o:["Niveau","Perceuse","Forets","Crayon"], sub:["Placer la cuvette, vérifier de niveau, marquer les trous.","Percer, cheviller (chevilles adaptées au sol).","Présenter sans serrer à fond."] },
        { t:"Raccorder l'évacuation", d:"~30-60 min", o:["Scie","Manchon","Colle PVC"], sub:["Classique : pipe Ø100 vers la chute, **pente 1-3 cm/m**.","Broyeur : sortie Ø32/40 vers l'évac existante.","Vérifier l'étanchéité des emboîtements."] },
        { t:"Raccorder l'alimentation d'eau", d:"~20 min", o:["Clés","Téflon/filasse"], sub:["Robinet d'arrêt + flexible (**eau froide**).","Étancher les filetages.","Raccorder au réservoir."] },
        { t:"Fixer, étancher & tester", d:"~30 min + essais", o:["Silicone","Clés"], sub:["Serrer les fixations, **joint silicone au sol**.","Ouvrir l'eau, remplir le réservoir.","Tester plusieurs chasses ; vérifier l'absence de fuite (alim + évac)."] }
      ],
      astuces:["⚠️ **Diamètre/pente d'évacuation = LE point critique** → d'où l'intérêt du **broyeur** sur un emplacement lave-linge.","Fais le rough-in (arrivée/évac) avant le sol ; pose finale de la cuvette après.","Vérifier la distance de refoulement max d'un broyeur."],

    { id:"deplacement-radiateur", titre:"Déplacement d'un radiateur", icone:"♨️",

        { t:"Créer la nouvelle alimentation", d:"~1-2 h", o:["Coupe-tube","Sertisseuse (eau)","Outillage saignée (élec)"], sub:["(Eau) Té sur le réseau, tirer les tubes vers le nouvel emplacement.","(Élec) Amener/créer la ligne dédiée.","Passages encastrés → **avant le sol**."] },
        { t:"Poser supports & radiateur", d:"~30-45 min", o:["Niveau","Perceuse","Chevilles"], sub:["Fixer les supports **de niveau** (~10-12 cm du sol, sous fenêtre).","Accrocher le radiateur.","(Eau) Monter robinet thermostatique + coude de réglage."] },
        { t:"Mise en service", d:"~20 min", o:["Clé à purgeur","Manomètre"], sub:["(Eau) Rouvrir les vannes, remettre en eau, **PURGER l'air**.","Contrôler la pression (~1-1,5 bar), refaire l'appoint.","Vérifier l'étanchéité ; (élec) tester la chauffe."] }
      ],
      astuces:["⚠️ **Bien purger** sinon le radiateur ne chauffe pas.","Emplacement **sous fenêtre** = meilleure diffusion.","Élec : respecter la **ligne dédiée**."],
      pro:"**Élec = DIY accessible.** **Eau / chauffage central** (reprise réseau, soudure, chaudière sous garantie) → **chauffagiste/plombier**." }
  ]},

  { titre:"3 · Sol — pose", icone:"🪵", fiches:[

  { titre:"4 · Montages", icone:"🧱", fiches:[

      securite:["EPI + genouillères.","Couper eau/élec pour les raccords.","**Fixation murale sérieuse** (hauts chargés) — cf mémo placo."],
      outillage:["Niveau laser + niveau à bulle","Perceuse-visseuse (+ perforateur)","Serre-joints, détecteur","Scie circulaire + rail, scie cloche","Embouts Pozidriv + hex, pistolet à mastic"],
      materiel:["Caissons METOD, rail de suspension, pieds","Chevilles adaptées (Molly si placo)","Plan de travail, plinthes, joues","Silicone sanitaire"],
      etapes:[

        { t:"Poser le rail de suspension", d:"~30-45 min", o:["Perceuse","Détecteur","Molly","Niveau"], sub:["Repérer les montants (cf mémo placo).","Visser le rail **dans chaque montant + Molly**.","Vérifier le rail **parfaitement de niveau**."] },

/* ---------- rendu ---------- */
function fmt(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function list(items){ return "<ul>"+items.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>"; }
function renderSteps(steps){
  return steps.map(function(s,i){
    var tools = (s.o&&s.o.length&&!(s.o.length===1&&s.o[0]==="—")) ? "<div class='step-tools'>"+s.o.map(function(t){return "<span class='chip'>🧰 "+fmt(t)+"</span>";}).join("")+"</div>" : "";
    var subs  = (s.sub&&s.sub.length) ? "<ul>"+s.sub.map(function(x){return "<li>"+fmt(x)+"</li>";}).join("")+"</ul>" : "";
    var time  = s.d ? "<span class='step-time'>⏱ "+fmt(s.d)+"</span>" : "";
    return "<div class='step'><div class='step-head'><span class='step-num'>"+(i+1)+"</span>"
      + "<span class='step-title'>"+fmt(s.t)+"</span>"+time+"</div>"+tools+subs+"</div>";
  }).join("");
}
function renderFiche(f){
  return "<article class='fiche'>"
   + "<h1>"+(f.icone||"")+" "+fmt(f.titre)+"</h1>"
   + "<div class='block'><h2>🎯 Objectif</h2><p class='lead'>"+fmt(f.objectif)+"</p></div>"
   + "<div class='bref'><span><b>Difficulté</b>"+fmt(f.bref.diff)+"</span><span><b>Durée totale</b>"+fmt(f.bref.duree)+"</span><span><b>Budget</b>"+fmt(f.bref.budget)+"</span></div>"
   + "<div class='block callout warn'><h2>⚠️ Sécurité &amp; vigilance</h2>"+list(f.securite)+"</div>"
   + "<div class='block'><h2>🧰 Outillage (récap)</h2>"+list(f.outillage)+"</div>"
   + "<div class='block'><h2>📦 Matériel / fournitures</h2>"+list(f.materiel)+"</div>"
   + "<div class='block'><h2>🔧 Étapes pas à pas</h2>"+renderSteps(f.etapes)+"</div>"
   + "<div class='block callout tip'><h2>💡 Astuces &amp; pièges</h2>"+list(f.astuces)+"</div>"
   + "<div class='block'><h2>👷 Pro ou DIY ?</h2><p>"+fmt(f.pro)+"</p></div>"
   + "</article>";
}
function renderHome(){
  var h = "<article class='fiche'><h1>🛠️ Mes travaux</h1>"
    + "<p class='lead'>Rubriques dans <strong>l'ordre du chantier</strong>. Chaque fiche est un <strong>pas-à-pas</strong> : étapes numérotées, <strong>⏱ temps estimé</strong> et <strong>🧰 outils</strong> par étape.</p>"
    + "<div class='block callout tip'><h2>🗺️ Ordre du chantier conseillé</h2><ol>"
      + "<li><strong>Dépose</strong> de l'ancien sol.</li>"
      + "<li><strong>Réseaux</strong> : élec, plomberie, chauffage — <em>avant</em> le sol.</li>"
      + "<li><strong>Pose du sol</strong> (parquet).</li>"
      + "<li><strong>Montages</strong> : cuisine puis dressing.</li>"
      + "</ol></div>";
  DATA.forEach(function(r){
    h += "<div class='block'><h2>"+(r.icone||"")+" "+fmt(r.titre)+"</h2><ul class='home-list'>";
    r.fiches.forEach(function(f){ h += "<li><a href='#"+f.id+"'>"+(f.icone||"")+" "+fmt(f.titre)+"</a><span class='tag'>"+fmt(f.bref.duree)+"</span></li>"; });
    h += "</ul></div>";
  });
  h += "<footer>Mémo perso — vérifie toujours le type de mur, les charges et les réseaux (eau/élec/gaz) avant d'intervenir. Doute élec / plomberie sous pression / gaz : fais appel à un pro. Les temps sont indicatifs (bricoleur soigneux).</footer></article>";
  return h;
}
function buildNav(){
  document.getElementById("nav").innerHTML = DATA.map(function(r){
    return "<div class='group'><div class='group-title'>"+(r.icone||"")+" "+fmt(r.titre)+"</div>"
      + r.fiches.map(function(f){ return "<a href='#"+f.id+"'>"+fmt(f.titre)+"</a>"; }).join("")+"</div>";
  }).join("");
}
function route(){
  var id = location.hash.replace(/^#/,""), fiche=null;
  DATA.forEach(function(r){ r.fiches.forEach(function(f){ if(f.id===id) fiche=f; }); });
  document.getElementById("content").innerHTML = fiche ? renderFiche(fiche) : renderHome();
  Array.prototype.forEach.call(document.querySelectorAll(".nav a"), function(a){ a.classList.toggle("active", a.getAttribute("href")==="#"+id); });
  document.body.classList.remove("nav-open"); window.scrollTo(0,0);
}
buildNav(); window.addEventListener("hashchange", route); route();
document.getElementById("burger").addEventListener("click", function(){ document.body.classList.toggle("nav-open"); });
document.getElementById("scrim").addEventListener("click", function(){ document.body.classList.remove("nav-open"); });
</script>
