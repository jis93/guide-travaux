    <text x="45" y="62" font-size="7" text-anchor="middle" fill="#64748b">(+ grands moules)</text>
    <rect x="12" y="95" width="66" height="45" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="45" y="122" font-size="10" text-anchor="middle" fill="#7f1d1d">MO</text>
    <rect x="12" y="150" width="66" height="85" fill="#cbd5e1" stroke="#334155"/>
    <text x="45" y="197" font-size="11" text-anchor="middle" fill="#0f172a">FOUR</text>
