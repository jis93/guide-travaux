    <line x1="90" y1="274" x2="180" y2="274" stroke="#94a3b8"/><line x1="90" y1="303" x2="180" y2="303" stroke="#94a3b8"/>
    <text x="135" y="263" font-size="8" text-anchor="middle" fill="#0f172a">épices</text>
    <text x="135" y="292" font-size="8" text-anchor="middle" fill="#0f172a">poêles · couvercles</text>
    <text x="135" y="325" font-size="8" text-anchor="middle" fill="#0f172a">casseroles · marmite</text>
