    <line x1="210" y1="274" x2="300" y2="274" stroke="#94a3b8"/><line x1="210" y1="303" x2="300" y2="303" stroke="#94a3b8"/>
    <text x="255" y="263" font-size="8" text-anchor="middle" fill="#0f172a">couverts</text>
    <text x="255" y="292" font-size="8" text-anchor="middle" fill="#0f172a">ustensiles</text>
    <text x="255" y="335" font-size="8" text-anchor="middle" fill="#0f172a">tupperwares</text>
