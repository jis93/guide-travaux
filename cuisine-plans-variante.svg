    <line x1="12" y1="333" x2="78" y2="333" stroke="#94a3b8"/>
    <text x="45" y="322" font-size="8" text-anchor="middle" fill="#0f172a">pâtisserie · balance</text>
    <text x="45" y="355" font-size="8" text-anchor="middle" fill="#0f172a">électro lourd</text>

    <!-- upper cabinets (140->220) -->
    <rect x="180" y="45" width="105" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="232" y="108" font-size="10" text-anchor="middle" fill="#0f172a">plats · bols · saladiers</text>
    <rect x="285" y="45" width="105" height="120" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/>
    <text x="337" y="108" font-size="10" text-anchor="middle" fill="#0f172a">bocaux · farines</text>
    <!-- hotte -->
