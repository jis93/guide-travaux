    <text x="-14" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-14" y="49"  font-size="10" text-anchor="end" fill="#334155">220</text>
    <text x="-14" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
