  <!-- legend -->
  <g transform="translate(130,1660)">
    <rect x="0"   y="0" width="16" height="12" fill="#eef2f6" stroke="#334155"/><text x="22" y="10" font-size="10" fill="#0f172a">meuble</text>
    <rect x="90"  y="0" width="16" height="12" fill="#dbeafe" stroke="#1e40af"/><text x="112" y="10" font-size="10" fill="#0f172a">électroménager / colonne</text>
    <rect x="260" y="0" width="16" height="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="4 3"/><text x="282" y="10" font-size="10" fill="#0f172a">meuble haut</text>
    <rect x="380" y="0" width="16" height="12" fill="#fde68a" stroke="#b45309"/><text x="402" y="10" font-size="10" fill="#0f172a">coffrage / joue / fileur</text>
    <rect x="0" y="22" width="16" height="12" fill="#fed7aa" stroke="#ea580c"/><text x="22" y="32" font-size="10" fill="#0f172a">prise 16A (plan)</text>
    <rect x="150" y="22" width="16" height="12" fill="#e0e7ff" stroke="#4338ca"/><text x="172" y="32" font-size="10" fill="#0f172a">circuit spécialisé (derrière l'appareil)</text>
    <line x1="380" y1="28" x2="396" y2="28" stroke="#f59e0b" stroke-width="3"/><text x="402" y="32" font-size="10" fill="#0f172a">LED</text>
    <text x="0" y="54" font-size="10" fill="#0f172a">Variante : armoire → colonne four+MO. Gains : four à mi-hauteur, tiroir sous plaque, meuble libéré au-dessus de l'évier, robinet libre. Coût : ~20 cm de plan en moins.</text>
