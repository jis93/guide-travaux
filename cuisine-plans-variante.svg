    <text x="225" y="340" font-size="8" text-anchor="middle" fill="#0f172a">poubelles tri</text>
    <rect x="270" y="240" width="30" height="135" fill="#eef2f6" stroke="#334155"/>
    <text x="285" y="312" font-size="9" text-anchor="middle" fill="#0f172a">t20</text>
    <text x="285" y="326" font-size="7" text-anchor="middle" fill="#0f172a">torchons</text>
    <text x="285" y="336" font-size="7" text-anchor="middle" fill="#0f172a">films</text>
    <rect x="300" y="75" width="135" height="300" fill="#dbeafe" stroke="#1e40af"/>
    <text x="367" y="230" font-size="12" text-anchor="middle" fill="#1e3a8a">FRIGO 90</text>
    </g>
    <rect x="90" y="240" width="7.5" height="135" fill="#fef3c7" stroke="#b45309"/>
    <rect x="442.5" y="75" width="7.5" height="300" fill="#fef3c7" stroke="#b45309"/>
    <text x="446" y="60" font-size="8" text-anchor="middle" fill="#7c2d12">joue 5</text>

    <line x1="0" y1="0" x2="450" y2="0" stroke="#111827" stroke-width="2"/>
    <line x1="0" y1="375" x2="450" y2="375" stroke="#111827" stroke-width="4"/>

    <text x="-8" y="4"   font-size="10" text-anchor="end" fill="#334155">250</text>
    <text x="-8" y="19"  font-size="10" text-anchor="end" fill="#334155">240</text>
    <text x="-8" y="169" font-size="10" text-anchor="end" fill="#334155">140</text>
    <text x="-8" y="244" font-size="10" text-anchor="end" fill="#334155">90</text>
    <text x="-8" y="378" font-size="10" text-anchor="end" fill="#334155">0</text>

    <line x1="0" y1="168" x2="300" y2="168" stroke="#f59e0b" stroke-width="3"/>
    <text x="150" y="182" font-size="9" text-anchor="middle" fill="#b45309">LED sous meubles hauts</text>
    <rect x="38" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="45" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">coin 2×16A (A)</text>
    <rect x="128" y="212" width="14" height="14" fill="#fed7aa" stroke="#ea580c"/><text x="135" y="209" font-size="8" text-anchor="middle" fill="#7c2d12">LV 2×16A (B)</text>
    <rect x="128" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="135" y="324" font-size="8" text-anchor="middle" fill="#3730a3">20A LV</text>
    <rect x="360" y="328" width="14" height="14" fill="#e0e7ff" stroke="#4338ca"/><text x="367" y="324" font-size="8" text-anchor="middle" fill="#3730a3">16A frigo</text>
    <text x="225" y="405" font-size="12" text-anchor="middle" fill="#0f172a">300 cm — hauts à 240 ; angle à 220</text>
