<style>

<body>
<div id="ui">
  <h1><span>🍳 Cuisine en L — 3D</span><button id="min" title="Réduire">–</button></h1>
  <div class="body">
    <div class="row">
      <button id="vA" class="on">A · Armoire</button>

      <button id="vB">B · Colonne four+MO</button>

    </div>

    <div class="row">
      <button id="mVisit" class="on">🚶 Visite</button>
      <button id="mOrbit">🔭 Vue d'ensemble</button>
    </div>
    <div class="row">
      <button id="openAll">Tout ouvrir</button>
      <button id="lbl" class="on">Étiquettes</button>
    </div>
    <div><label>Hauteur des yeux <input id="eye" type="range" min="100" max="195" value="165"> <span id="eyeV">165</span> cm</label></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Unités : 1 = 1 cm. Repère : angle de la pièce en (0,0,0).
// Mur 2 (300 cm) le long de +X (plan du mur z=0), Mur 1 (260 cm) le long de +Z (plan du mur x=0).
const isTouch = matchMedia('(pointer:coarse)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ee);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 2, 5000);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9ad98, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(380, 420, 330);
sun.target.position.set(80, 0, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -350, right: 350, top: 350, bottom: -350, near: 10, far: 1400 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const ceilLight = new THREE.PointLight(0xfff4e0, 0.9, 0, 0);
ceilLight.position.set(160, 245, 160);
scene.add(ceilLight);

const std = (color, roughness = 0.8, metalness = 0, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, ...extra });
const M = {
  wall: std(0xf4f1ec, 0.95), floor: std(0xcdb48e, 0.75), ceil: std(0xfbfbfa, 1),
  carcass: std(0xf3f3f0, 0.8), front: std(0xe8e5de, 0.5), frontUp: std(0xf1efea, 0.5),
  worktop: std(0xa57c52, 0.6), plinth: std(0x6b6f75, 0.7), corner: std(0xcfd3d8, 0.9),
  steel: std(0xc6cbd0, 0.35, 0.55), black: std(0x1f2124, 0.3), dark: std(0x2b2e33, 0.8),
  ovenIn: std(0x3a3d42, 0.9), fridge: std(0xeef1f4, 0.4), fridgeIn: std(0xf8fbff, 0.6, 0, { emissive: 0x30363d }),
  dwIn: std(0x9aa1a8, 0.5, 0.4), sink: std(0xaeb4ba, 0.3, 0.7), handle: std(0x50555c, 0.4, 0.6),
  coffrage: std(0xebe7df, 0.95), ring: std(0x4a2525, 0.6),
  led: new THREE.MeshBasicMaterial({ color: 0xffe2a8 }),
};
const EDGE = new THREE.LineBasicMaterial({ color: 0x7c838c, transparent: true, opacity: 0.5 });

// ---------- helpers ----------
let world, openables = [], pickables = [], labels = [];
let showLabels = true;
// Inventaire de ce qu'il y a à ranger : chaque variante place ses objets via tag(id) ; le reste apparaît dans « Pas encore placé ».
const INV = {
  electro: 'petit électroménager',
  casseroles: 'casseroles · marmite',
  poeles: 'poêles · couvercles',
  couverts: 'couverts',
  ustensiles: 'ustensiles',
  patisserie: 'pâtisserie · balance',
  tupperwares: 'tupperwares',
  epices: 'épices',
  thes: 'thés (~30 boîtes)',
  bocaux: 'bocaux · farines',
};
let placed = new Map(); // id -> emplacement

function B(parent, x0, x1, y0, y1, z0, z1, mat, edges = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = m.receiveShadow = true;
  if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), EDGE));
  parent.add(m);
  return m;
}
function makeOp(name, pivot, kind, amt, meshes) {
  const op = { name, pivot, kind, amt, t: 0, target: 0 };
  for (const m of meshes) { m.userData.op = op; pickables.push(m); }
  openables.push(op);
  return op;
}
function applyOp(op) {
  const e = op.t * op.t * (3 - 2 * op.t);
  const p = op.pivot;
  if (op.kind === 'L') p.rotation.y = -op.amt * e;
  else if (op.kind === 'R') p.rotation.y = op.amt * e;
  else if (op.kind === 'down') p.rotation.x = op.amt * e;
  else if (op.kind === 'up') p.rotation.x = -op.amt * e;
  else if (op.kind === 'drawer') p.position.z = op.amt * e;
}
const G = 0.25; // jeu entre façades

// Porte battante. zf = plan avant du caisson. hinge 'L'|'R' (vu de face). hy = position poignée.
function door(p, x0, x1, y0, y1, zf, hinge, name, mat = M.front, hy = 'top') {
  const w = x1 - x0 - 2 * G;
  const pv = new THREE.Group();
  pv.position.set(hinge === 'L' ? x0 + G : x1 - G, 0, zf);
  p.add(pv);
  const a = hinge === 'L' ? 0 : -w, b = hinge === 'L' ? w : 0;
  const panel = B(pv, a, b, y0 + G, y1 - G, 0, 1.9, mat);
  const hx = hinge === 'L' ? b - 4 : a + 4;
  const hh = Math.min(18, (y1 - y0) * 0.4);
  const yc = hy === 'top' ? y1 - 6 - hh / 2 : hy === 'bottom' ? y0 + 6 + hh / 2 : (y0 + y1) / 2;
  const h = B(pv, hx - 0.6, hx + 0.6, yc - hh / 2, yc + hh / 2, 1.9, 4.2, M.handle, false);
  return makeOp(name, pv, hinge, 1.75, [panel, h]);
}
// Abattant (four, lave-vaisselle) : charnière en bas ('down') ou en haut ('up').
function flap(p, x0, x1, y0, y1, zf, dir, name, mat) {
  const h = y1 - y0 - 2 * G;
  const pv = new THREE.Group();
  pv.position.set(0, dir === 'down' ? y0 + G : y1 - G, zf);
  p.add(pv);
  const a = dir === 'down' ? 0 : -h, b = dir === 'down' ? h : 0;
  const panel = B(pv, x0 + G, x1 - G, a, b, 0, 1.9, mat);
  const hy = dir === 'down' ? b - 5 : a + 5;
  const w = (x1 - x0) * 0.6, xc = (x0 + x1) / 2;
  const hd = B(pv, xc - w / 2, xc + w / 2, hy - 0.6, hy + 0.6, 1.9, 4.2, M.handle, false);
  return makeOp(name, pv, dir, Math.PI / 2, [panel, hd]);
}
// Tiroir : façade + caisson qui coulisse.
function drawer(p, x0, x1, y0, y1, zf, name, depth = 50) {
  const pv = new THREE.Group();
  p.add(pv);
  const parts = [];
  parts.push(B(pv, x0 + G, x1 - G, y0 + G, y1 - G, zf, zf + 1.9, M.front));
  const w = (x1 - x0) * 0.6, xc = (x0 + x1) / 2, hy = y1 - 5;
  parts.push(B(pv, xc - w / 2, xc + w / 2, hy - 0.6, hy + 0.6, zf + 1.9, zf + 4.2, M.handle, false));
  const bh = Math.max(6, (y1 - y0) * 0.7), z0 = zf - depth;
  parts.push(B(pv, x0 + 2, x1 - 2, y0 + 2, y0 + 3, z0, zf, M.carcass, false));
  parts.push(B(pv, x0 + 2, x0 + 3.2, y0 + 3, y0 + 2 + bh, z0, zf, M.carcass));
  parts.push(B(pv, x1 - 3.2, x1 - 2, y0 + 3, y0 + 2 + bh, z0, zf, M.carcass));
  parts.push(B(pv, x0 + 2, x1 - 2, y0 + 3, y0 + 2 + bh, z0, z0 + 1.2, M.carcass));
  return makeOp(name, pv, 'drawer', depth * 0.85, parts);
}
// Caisson vide : 2 côtés, dessous, dessus, fond (pas de face avant).
function shell(p, x0, x1, y0, y1, z0, z1) {
  const t = 1.8;
  B(p, x0, x0 + t, y0, y1, z0, z1, M.carcass); B(p, x1 - t, x1, y0, y1, z0, z1, M.carcass);
  B(p, x0 + t, x1 - t, y0, y0 + t, z0, z1, M.carcass); B(p, x0 + t, x1 - t, y1 - t, y1, z0, z1, M.carcass);
  B(p, x0 + t, x1 - t, y0 + t, y1 - t, z0, z0 + 0.8, M.carcass);
}
function baseCarcass(p, x0, x1) {
  shell(p, x0, x1, 10, 86, 0, 58);
  B(p, x0, x1, 0, 10, 0, 52, M.plinth, false);
}
function drawers3(p, x0, x1, name) {
  drawer(p, x0, x1, 60, 86, 58, name + ' (haut)');
  drawer(p, x0, x1, 30, 60, 58, name + ' (milieu)');
  drawer(p, x0, x1, 10, 30, 58, name + ' (bas)');
}
// 3 tiroirs façades 20/20/40 (haut, milieu, bas profond) ; noms = contenu
function drawersRanges(p, x0, x1, [hi, mid, lo], where = 'tiroirs') {
  const xc = (x0 + x1) / 2, t = id => INV[id] || id;
  drawer(p, x0, x1, 67, 86, 58, t(hi));  tag(p, hi, xc, 80, 66, where + ' (haut)');
  drawer(p, x0, x1, 48, 67, 58, t(mid)); tag(p, mid, xc, 60, 66, where + ' (milieu)');
  drawer(p, x0, x1, 10, 48, 58, t(lo));  tag(p, lo, xc, 32, 66, where + ' (bas, profond)');
}
function upper(p, x0, x1, y0, y1, name, hinges) {
  shell(p, x0, x1, y0, y1, 0, 35);
  const n = hinges.length, w = (x1 - x0) / n;
  hinges.forEach((h, i) => door(p, x0 + i * w, x0 + (i + 1) * w, y0, y1, 35, h, name + (n > 1 ? ` (${i + 1})` : ''), M.frontUp, 'bottom'));
}
// Meuble haut avec hotte casquette intégrée : porte au-dessus, visière inox coulissante en bas.
function hoodCab(p, x0, x1) {
  // bas du meuble à 160 = 70 cm au-dessus de la plaque (mini hotte ≈ 65)
  shell(p, x0, x1, 160, 220, 0, 35);
  door(p, x0, x1, 170, 220, 35, 'L', 'Meuble hotte', M.frontUp, 'bottom');
  B(p, x0 + 1.5, x1 - 1.5, 160, 161, 2, 33, M.dark, false);
  const pv = new THREE.Group(); p.add(pv);
  const parts = [
    B(pv, x0 + G, x1 - G, 160.3, 169.7, 33.1, 35.5, M.steel),
    B(pv, x0 + 2, x1 - 2, 160.3, 161.3, 12, 33.1, M.steel, false),
  ];
  makeOp('Hotte casquette (visière)', pv, 'drawer', 14, parts);
  label(p, 'meuble hotte', (x0 + x1) / 2, 200, 40);
  label(p, 'hotte casquette', (x0 + x1) / 2, 156, 42);
}
function hob(p, x0, x1) {
  B(p, x0 + 2, x1 - 2, 90, 90.6, 5, 57, M.black, false);
  const xc = (x0 + x1) / 2;
  for (const [dx, dz, r] of [[-14, 18, 9], [14, 18, 7], [-14, 42, 7], [14, 42, 9]]) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.2, 32), M.ring);
    c.position.set(xc + dx, 90.7, dz);
    p.add(c);
  }
}
// Étagère ouverte (épaisseur 2, profondeur z0→z1) — variante B' (angle en étagères).
function shelf(p, x0, x1, y, z0, z1) { B(p, x0, x1, y - 2, y, z0, z1, M.worktop); }
const SHELF_Y = [150, 170, 190]; // la plus haute à 190 : bouche VMC dégagée au-dessus
const SHELF_D = 28;
function led(p, x0, x1) { B(p, x0 + 1, x1 - 1, 139.2, 139.8, 28, 31, M.led, false); }

// ---------- cotes au sol ----------
const DIM = new THREE.MeshBasicMaterial({ color: 0x1e293b });
function floorLine(p, x0, x1, z0, z1) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.3, z1 - z0), DIM);
  m.position.set((x0 + x1) / 2, 0.45, (z0 + z1) / 2);
  m.visible = showLabels; p.add(m); labels.push(m);
}
// Texte posé à plat sur le sol, lisible depuis la pièce en regardant le mur.
function floorText(p, text, x, z, h, bold = true) {
  const fs = 64, pad = 16;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  const font = `${bold ? 700 : 500} ${fs}px system-ui,Arial`;
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width + pad * 2);
  c.height = fs + 20;
  ctx = c.getContext('2d');
  ctx.font = font;
  ctx.fillStyle = 'rgba(255,255,255,.88)';
  ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 16); ctx.fill();
  ctx.fillStyle = '#0f172a'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.fillText(text, c.width / 2, c.height / 2 + 3);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(h * c.width / c.height, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.set(x, 0.6, z);
  m.renderOrder = 5;
  m.visible = showLabels; p.add(m); labels.push(m);
}
// Chaîne de cotes : segments [largeur, nom] à partir de x0, puis largeur totale du côté.
// Le coin (60×60) est sous l'autre linéaire : il n'apparaît que dans le total.
function dims(p, x0, segs, total) {
  const zt = 72, zl = 82, zT = 95;
  let x = x0;
  floorLine(p, x - 0.3, x + 0.3, zl - 3, zl + 3);
  for (const [w, name] of segs) {
    floorText(p, w < 25 ? `${w}` : `${name} ${w}`, x + w / 2, zt, w < 25 ? 6 : 7);
    floorLine(p, x, x + w, zl - 0.25, zl + 0.25);
    x += w;
    floorLine(p, x - 0.3, x + 0.3, zl - 3, zl + 3);
  }
  floorText(p, total, (x0 + x) / 2, zT, 9);
}
function label(p, text, x, y, z, bg = 'rgba(15,23,42,.78)') {
  const fs = 44, pad = 14;
  const c = document.createElement('canvas');
  let ctx = c.getContext('2d');
  ctx.font = `600 ${fs}px system-ui,Arial`;
  c.width = Math.ceil(ctx.measureText(text).width + pad * 2);
  c.height = fs + 18;
  ctx = c.getContext('2d');
  ctx.font = `600 ${fs}px system-ui,Arial`;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(0, 0, c.width, c.height, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  ctx.fillText(text, pad, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const h = 5;
  s.scale.set(h * c.width / c.height, h, 1);
  s.position.set(x, y, z);
  s.renderOrder = 10;
  s.visible = showLabels;
  p.add(s);
  labels.push(s);
}
// Étiquette d'un objet de l'inventaire (vert) ; texte libre sinon. where = emplacement affiché dans la liste.
function tag(p, id, x, y, z, where) {
  if (!(id in INV)) return label(p, id, x, y, z);
  label(p, '📦 ' + INV[id], x, y, z, 'rgba(22,101,52,.9)');
  placed.set(id, where || '');
}

// ---------- pièce (commune) ----------
B(scene, -10, 300, 0, 250, -10, 0, M.wall, false);   // Mur 2
B(scene, -10, 0, 0, 250, 0, 260, M.wall, false);     // Mur 1
const floor = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), M.floor);
floor.rotation.x = -Math.PI / 2; floor.position.set(250, 0, 250); floor.receiveShadow = true;
scene.add(floor);
const grid = new THREE.GridHelper(500, 10, 0x8b7a5e, 0x8b7a5e);
grid.position.set(250, 0.15, 250); grid.material.transparent = true; grid.material.opacity = 0.25;
scene.add(grid);
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), M.ceil);
ceiling.rotation.x = Math.PI / 2; ceiling.position.set(250, 250, 250);
scene.add(ceiling);

// ---------- Mur 2 (angle à gauche → frigo à droite), commun aux variantes ----------
function buildMur2(p, moAboveSink, angle = 'aveugle', evierFrigo = false) {
  // coin mort partagé 60×60
  B(p, 0, 60, 10, 86, 0, 60, M.corner); B(p, 0, 60, 0, 10, 0, 52, M.plinth, false);
  label(p, 'coin (mort)', 30, 70, 64);
  // fileur 5 contre le coin (le LV ne peut pas être collé aux tiroirs du Mur 1)
  B(p, 60, 65, 10, 86, 0, 60, M.front); B(p, 60, 65, 0, 10, 0, 52, M.plinth, false);
  B(p, 0, 5, 86, 90, 0, 62, M.worktop);
  // tout ce qui suit est décalé de 5 cm (fileur)
  const q = new THREE.Group(); q.position.x = 5; p.add(q);
  // ordre standard : LV 60 | évier 60 | coulissant 20 ; evierFrigo : LV 60 | coulissant 20 | évier 60 (évier contre le frigo)
  const lx = 60, cx = evierFrigo ? 120 : 180, sx = evierFrigo ? 140 : 120;
  // lave-vaisselle intégré
  B(q, lx, lx + 60, 10, 86, 0, 56, M.dark); B(q, lx + 2, lx + 58, 12, 84, 56, 57.6, M.dwIn, false);
  B(q, lx, lx + 60, 0, 10, 0, 52, M.plinth, false);
  flap(q, lx, lx + 60, 10, 86, 57.8, 'down', 'Lave-vaisselle', M.front);
  label(q, 'LV 60', lx + 30, 70, 64);
  // évier

function disposeTree(o) {
  o.traverse(c => {
    if (c.geometry) c.geometry.dispose();
    if ((c.isSprite || c.isMesh) && c.material && c.material.map) { c.material.map.dispose(); c.material.dispose(); }
  });
}
function setVariant(v) {
  variant = v;
  if (world) { scene.remove(world); disposeTree(world); }
  openables = []; pickables = []; labels = []; placed = new Map();
  world = new THREE.Group();

  world.add(m1, m2);
  VARIANTS[v].build(m1, m2);
  scene.add(world);
  if (allOpen) openables.forEach(o => { o.target = o.t = 1; applyOp(o); });
  for (const k of Object.keys(VARIANTS)) document.getElementById('v' + k).classList.toggle('on', v === k);
  document.getElementById('desc').innerHTML = VARIANTS[v].desc;

}
function renderInv() {
  const ids = Object.keys(INV), miss = ids.filter(id => !placed.has(id));

  h += miss.length
    ? '<div class="miss">Pas encore placé :</div><ul>' + miss.map(id => `<li class="miss">${INV[id]}</li>`).join('') + '</ul>'
    : '<div class="ok">✓ Tout est placé</div>';
  h += '<details><summary>Voir où est rangé le reste</summary><ul>'

  document.getElementById('inv').innerHTML = h;
}

const player = { x: 280, z: 280, yaw: Math.PI / 4, pitch: -0.22, eye: 165 };
const R = 20; // rayon du corps
const OBST = [ [0, 300, 0, 62], [0, 62, 0, 265] ]; // emprises au sol des 2 linéaires (x0,x1,z0,z1)
function collide() {
  player.x = Math.min(Math.max(player.x, R), 480);
  player.z = Math.min(Math.max(player.z, R), 480);
  for (const [x0, x1, z0, z1] of OBST) {
    const ax0 = x0 - R, ax1 = x1 + R, az0 = z0 - R, az1 = z1 + R;
    if (player.x > ax0 && player.x < ax1 && player.z > az0 && player.z < az1) {
      const pen = [[player.x - ax0, 'x', ax0], [ax1 - player.x, 'x', ax1], [player.z - az0, 'z', az0], [az1 - player.z, 'z', az1]]
        .sort((a, b) => a[0] - b[0])[0];
      player[pen[1]] = pen[2];
    }
  }
}

function toggleOp(op) { if (op) op.target = op.target ? 0 : 1; }
let down = null;
canvas.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', e => {
  if (e.pointerType !== 'mouse' || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5;
  down = null;
  if (moved) return;
  if (mode === 'visit') {
    if (!locked()) canvas.requestPointerLock();
    else toggleOp(pickCenter());
  } else {
    toggleOp(pickAt(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1));
  }
});

// tactile (mode visite) : moitié gauche = marcher, moitié droite = regarder, tap = ouvrir/fermer
const touches = new Map();
const joy = { x: 0, y: 0 };
canvas.addEventListener('touchstart', e => {
  for (const t of e.changedTouches)
    touches.set(t.identifier, { sx: t.clientX, sy: t.clientY, lx: t.clientX, ly: t.clientY, side: t.clientX < innerWidth / 2 ? 'move' : 'look', t0: performance.now(), moved: false });
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (mode !== 'visit') return;
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); if (!s) continue;
    if (Math.hypot(t.clientX - s.sx, t.clientY - s.sy) > 10) s.moved = true;
    if (s.side === 'look') {
      player.yaw -= (t.clientX - s.lx) * 0.006;
      player.pitch = Math.min(1.45, Math.max(-1.45, player.pitch - (t.clientY - s.ly) * 0.006));
    } else {
      joy.x = Math.max(-1, Math.min(1, (t.clientX - s.sx) / 60));
      joy.y = Math.max(-1, Math.min(1, (t.clientY - s.sy) / 60));
    }
    s.lx = t.clientX; s.ly = t.clientY;
  }
}, { passive: true });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); touches.delete(t.identifier);
    if (!s) continue;
    if (s.side === 'move') { joy.x = joy.y = 0; }
    if (!s.moved && performance.now() - s.t0 < 350)
      toggleOp(pickAt(t.clientX / innerWidth * 2 - 1, -(t.clientY / innerHeight) * 2 + 1, mode === 'visit' ? 260 : Infinity));
  }
}, { passive: true });

// ---------- vue d'ensemble ----------
const orbit = new OrbitControls(camera, canvas);
orbit.target.set(110, 90, 110);
orbit.enableDamping = true;
orbit.enabled = false;
function setMode(m) {
  mode = m;
  if (m === 'orbit') {
    if (locked()) document.exitPointerLock();
    camera.position.set(430, 340, 460);
    orbit.target.set(110, 90, 110);
    orbit.enabled = true;
    orbit.update();
  } else {
    orbit.enabled = false;
  }
  ceiling.visible = m === 'visit';
  avatar.visible = m === 'orbit';
  document.getElementById('mVisit').classList.toggle('on', m === 'visit');
  document.getElementById('mOrbit').classList.toggle('on', m === 'orbit');
  updateOverlay();
}
function updateOverlay() {
  const v = mode === 'visit';
  document.getElementById('cross').style.display = v ? '' : 'none';
  document.getElementById('start').style.display = v && !isTouch && !locked() ? '' : 'none';
  document.getElementById('help').innerHTML = isTouch
    ? (v ? 'Glisser à gauche : marcher · à droite : regarder · tap sur une porte/tiroir : ouvrir/fermer.'
         : 'Glisser : tourner · pincer : zoom · tap : ouvrir/fermer.')
    : (v ? 'Clic pour entrer · souris : regarder · <b>ZQSD/WASD</b> ou flèches : marcher · <b>clic</b> ou <b>E</b> : ouvrir/fermer · <b>V</b> variante · <b>C</b> vue · <b>O</b> tout ouvrir · <b>L</b> étiquettes · Échap : sortir'
         : 'Glisser : tourner · clic droit : déplacer · molette : zoom · clic : ouvrir/fermer · <b>V</b> variante · <b>C</b> visite');
}
function toggleAll() {
  allOpen = !allOpen;
  openables.forEach(o => o.target = allOpen ? 1 : 0);
  document.getElementById('openAll').textContent = allOpen ? 'Tout fermer' : 'Tout ouvrir';
}
function toggleLabels() {
  showLabels = !showLabels;
  labels.forEach(l => l.visible = showLabels);
  document.getElementById('lbl').classList.toggle('on', showLabels);
}

// UI
const $ = id => document.getElementById(id);
$('vA').onclick = () => setVariant('A');
$('vA2').onclick = () => setVariant('A2');
$('vB').onclick = () => setVariant('B');
$('vB2').onclick = () => setVariant('B2');
$('vC').onclick = () => setVariant('C');
$('mVisit').onclick = () => setMode('visit');
$('mOrbit').onclick = () => setMode('orbit');
$('openAll').onclick = toggleAll;
$('lbl').onclick = toggleLabels;
$('min').onclick = () => { $('ui').classList.toggle('min'); $('min').textContent = $('ui').classList.contains('min') ? '+' : '–'; };
$('eye').oninput = e => { player.eye = +e.target.value; $('eyeV').textContent = e.target.value; };
for (const b of document.querySelectorAll('button')) b.addEventListener('keydown', e => e.preventDefault());
if (isTouch) $('ui').classList.add('min'), $('min').textContent = '+';

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- boucle ----------
const clock = new THREE.Clock();
const tip = $('tip');
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const o of openables) {
    if (o.t !== o.target) {
      o.t = o.target > o.t ? Math.min(1, o.t + dt * 2.5) : Math.max(0, o.t - dt * 2.5);
      applyOp(o);
    }
  }
  if (mode === 'visit') {
    let f = 0, s = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1;
    if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyD || keys.ArrowRight) s += 1;
    if (keys.KeyA || keys.ArrowLeft) s -= 1;
    f -= joy.y; s += joy.x;
    const speed = (keys.ShiftLeft || keys.ShiftRight ? 200 : 110) * dt;
    const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
    player.x += (-sy * f + cy * s) * speed;
    player.z += (-cy * f - sy * s) * speed;
    collide();
    camera.position.set(player.x, player.eye, player.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    const op = locked() ? pickCenter() : null;
    tip.style.display = op ? 'block' : 'none';
    if (op) tip.textContent = `${op.name} — ${op.target ? 'fermer' : 'ouvrir'} (clic / E)`;
  } else {
    orbit.update();
    tip.style.display = 'none';
    avatar.position.set(player.x, 0, player.z);
    body.scale.set(1, (player.eye + 10) / 37, 1);
    body.position.y = (player.eye + 10) / 2;
    nose.position.set(-Math.sin(player.yaw) * 26, player.eye, -Math.cos(player.yaw) * 26);
    nose.rotation.set(0, player.yaw, 0); nose.rotateX(-Math.PI / 2);
  }
  $('pos').textContent = `Position : ${Math.round(player.x - 62)} cm du plan Mur 1 · ${Math.round(player.z - 62)} cm du plan Mur 2`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
const qs = new URLSearchParams(location.search);
setVariant(VARIANTS[qs.get('v')] ? qs.get('v') : 'A');
setMode(qs.get('vue') === 'ensemble' ? 'orbit' : 'visit');
if (qs.get('ouvert') === '1') { toggleAll(); openables.forEach(o => { o.t = 1; applyOp(o); }); }
frame();
</script>
</body>
</html>
